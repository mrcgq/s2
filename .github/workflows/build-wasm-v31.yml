name: Build Version 31 WASM Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-wasm:
    name: Build WASM SIMD Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten 4.0.23
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23

      - name: Install Ninja & Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Download Bilingual Zipformer Model
        run: |
          cd wasm/asr/assets
          curl -L -O https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          tar xvf sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
          mv sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/encoder-epoch-99-avg-1.int8.onnx encoder.onnx
          mv sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/decoder-epoch-99-avg-1.onnx decoder.onnx
          mv sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/joiner-epoch-99-avg-1.int8.onnx joiner.onnx
          mv sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/tokens.txt ./
          rm -rf sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20*

      - name: Build WebAssembly Engine
        run: |
          mkdir -p build-wasm-simd-asr
          cd build-wasm-simd-asr
          cmake \
            -G Ninja \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_JNI=OFF \
            -DSHERPA_ONNX_ENABLE_C_API=ON \
            -DSHERPA_ONNX_ENABLE_TTS=OFF \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=OFF \
            -DSHERPA_ONNX_ENABLE_WASM=ON \
            -DSHERPA_ONNX_ENABLE_WASM_ASR=ON \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF \
            -DSHERPA_ONNX_IS_USING_BUILD_WASM_SH=ON \
            ..
          cmake --build . --target install

      - name: Deploy Version 31 MP3 UI
        run: |
          DIST=build-wasm-simd-asr/install/bin/wasm/asr
          cat << 'EOF' > $DIST/index.html
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Sherpa-ONNX WebAssembly (Version 31 God-Tier)</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
            h1 { text-align: center; color: #0f172a; margin-bottom: 5px; }
            .badge { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 25px; }
            .box { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
            .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
            button { padding: 10px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; }
            #startBtn { background: #2563eb; color: white; }
            #stopBtn { background: #ef4444; color: white; }
            #stopBtn:disabled { background: #cbd5e1; cursor: not-allowed; }
            #clearBtn { background: #e2e8f0; color: #475569; }
            .file-drop { border: 2px dashed #93c5fd; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; background: #eff6ff; margin-bottom: 20px; transition: all 0.2s; }
            .file-drop:hover { border-color: #2563eb; background: #dbeafe; }
            textarea { width: 100%; height: 260px; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; line-height: 1.6; box-sizing: border-box; resize: vertical; outline: none; font-family: inherit; }
            #status { font-size: 14px; color: #059669; margin-top: 12px; min-height: 22px; font-weight: 600; }
          </style>
          <script>
            var Module = {
              onRuntimeInitialized: function() {
                if (window.initEngine) window.initEngine();
              }
            };
          </script>
          <script src="sherpa-onnx-wasm-main-asr.js"></script>
          <script src="sherpa-onnx-asr.js"></script>
          </head>
          <body>
          <h1>Sherpa-ONNX 极速离线语音识别</h1>
          <div class="badge">🔥 Version 31 声学雷达 + 香农熵熔断器已注入 | 100% 浏览器本地计算</div>
          <div class="box">
            <div class="btn-group">
              <button id="startBtn">🎤 开启麦克风实时识别</button>
              <button id="stopBtn" disabled>⏹️ 停止录音</button>
              <button id="clearBtn">🗑️ 清空内容</button>
            </div>
            <div class="file-drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
              📂 <b style="font-size: 16px; color: #1d4ed8;">点击选择或拖拽 MP3 / WAV / M4A / FLAC 音频文件</b>
              <div style="font-size: 12px; color: #64748b; margin-top: 6px;">支持任意时长与采样率，浏览器硬件级 16kHz 重采样 + 20x 超实时转录</div>
              <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg" style="display: none;">
            </div>
            <textarea id="transcript" placeholder="识别出的文字将在这里秒级实时上屏..."></textarea>
            <div id="status">⏳ 正在加载 AI 模型与版本 31 引擎...</div>
          </div>
          <script>
          let recognizer = null, activeLiveStream = null, micStream = null, micCtx = null, micProcessor = null;
          const startBtn = document.getElementById('startBtn'), stopBtn = document.getElementById('stopBtn'), clearBtn = document.getElementById('clearBtn'), transcript = document.getElementById('transcript'), status = document.getElementById('status'), fileInput = document.getElementById('fileInput'), dropZone = document.getElementById('dropZone');
          window.initEngine = function() {
            try {
              recognizer = createOnlineRecognizer(Module);
              activeLiveStream = recognizer.createStream();
              status.innerText = "✅ 【版本 31 降维神级引擎就绪】现在点击上方按钮或选择 MP3 即可秒级转录！";
            } catch (err) { status.innerText = "❌ 初始化异常: " + err; }
          };
          if (typeof Module !== 'undefined' && Module._SherpaOnnxCreateOnlineRecognizer) window.initEngine();
          startBtn.onclick = async function() {
            if (!recognizer) return alert("模型正在加载中...");
            try {
              micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
              if (micCtx.state === 'suspended') await micCtx.resume();
              micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
              const source = micCtx.createMediaStreamSource(micStream);
              micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
              activeLiveStream = recognizer.createStream();
              micProcessor.onaudioprocess = function(e) {
                if (!recognizer || !activeLiveStream) return;
                activeLiveStream.acceptWaveform(16000, e.inputBuffer.getChannelData(0));
                while (recognizer.isReady(activeLiveStream)) recognizer.decode(activeLiveStream);
                const r = recognizer.getResult(activeLiveStream);
                if (r && r.text) transcript.value = r.text;
              };
              source.connect(micProcessor); micProcessor.connect(micCtx.destination);
              startBtn.disabled = true; stopBtn.disabled = false;
              status.innerText = "🎙️ 正在实时录音转录中（版本 31 声学雷达工作中）...";
            } catch (err) { alert("麦克风启动失败: " + err); }
          };
          stopBtn.onclick = function() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (micProcessor) micProcessor.disconnect();
            if (micCtx) micCtx.close();
            startBtn.disabled = false; stopBtn.disabled = true;
            status.innerText = "⏹️ 录音已停止。";
          };
          clearBtn.onclick = function() {
            transcript.value = "";
            if (activeLiveStream) { activeLiveStream.free(); activeLiveStream = recognizer.createStream(); }
            status.innerText = "🗑️ 内容已清空。";
          };
          fileInput.onchange = function(e) { if (e.target.files && e.target.files[0]) processAudioFile(e.target.files[0]); };
          dropZone.ondragover = function(e) { e.preventDefault(); };
          dropZone.ondrop = function(e) { e.preventDefault(); if (e.dataTransfer.files.length > 0) processAudioFile(e.dataTransfer.files[0]); };
          async function decodeAudioTo16kMono(ab) {
            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (tempCtx.state === 'suspended') await tempCtx.resume();
            const raw = await tempCtx.decodeAudioData(ab);
            tempCtx.close();
            const off = new OfflineAudioContext(1, Math.ceil(raw.duration * 16000), 16000);
            const src = off.createBufferSource(); src.buffer = raw; src.connect(off.destination); src.start(0);
            return (await off.startRendering()).getChannelData(0);
          }
          async function processAudioFile(file) {
            if (!recognizer) return alert("模型正在加载中...");
            status.innerText = "🎵 正在解码音频: " + file.name + "..."; transcript.value = "";
            try {
              const pcm16k = await decodeAudioTo16kMono(await file.arrayBuffer());
              const audioDur = pcm16k.length / 16000;
              status.innerText = "⚡ 正在极速推演中 (时长: " + audioDur.toFixed(1) + " 秒)...";
              const fs = recognizer.createStream(), chunkSize = 3200, t0 = performance.now();
              for (let i = 0; i < pcm16k.length; i += chunkSize) {
                fs.acceptWaveform(16000, pcm16k.subarray(i, Math.min(i + chunkSize, pcm16k.length)));
                while (recognizer.isReady(fs)) recognizer.decode(fs);
                const r = recognizer.getResult(fs);
                if (r && r.text) { transcript.value = r.text; transcript.scrollTop = transcript.scrollHeight; }
              }
              fs.inputFinished();
              while (recognizer.isReady(fs)) recognizer.decode(fs);
              const finalR = recognizer.getResult(fs);
              if (finalR && finalR.text) transcript.value = finalR.text;
              const cost = ((performance.now() - t0) / 1000).toFixed(2);
              status.innerText = "🎉 识别完成！耗时: " + cost + " 秒 | 达到 " + (audioDur / Math.max(0.01, parseFloat(cost))).toFixed(1) + "x 倍速超实时转录！";
              fs.free();
            } catch (err) { status.innerText = "❌ 识别失败: " + err; }
          }
          </script>
          </body>
          </html>
          EOF

      - name: Package and Upload WASM Release
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-version31-wasm-release
          path: build-wasm-simd-asr/install/bin/wasm/asr/
